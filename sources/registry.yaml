- id: de-competition
  name: Germany - Bundeskartellamt
  url: https://www.bundeskartellamt.de/
  type: national_authority
  country: DE
  language: *id021
  access:
    method: auto
    rss: ''
    notes: >-
      2026-08-17 specialist review. robots.txt (https://www.bundeskartellamt.de/robots.txt) disallows
      /DE/Service/ and /EN/Service/ (allowing only /SiteGlobals/Modules|StyleBundles|Frontend/). The
      site's real RSS feed, auto-discovered via <link rel=alternate> on the homepage, lives at
      https://www.bundeskartellamt.de/DE/Service/RSS/_documents/rssnewsfeed.xml — confirmed working
      (returns current 2026 Pressemitteilungen with correct pubDate) but its path is under the
      disallowed /DE/Service/ prefix, so it cannot be fetched while respecting robots.txt.
      Checked alternatives, none usable with the current collector without a code change:
      (1) robots.txt explicitly allows and lists a sitemap at
      https://www.bundeskartellamt.de/Sitemap_Index.xml -> https://www.bundeskartellamt.de/Sitemap_XML.xml,
      which does include current-year SharedDocs/Meldung/.../Pressemitteilungen article URLs (allowed
      paths), but it is a plain sitemap (no title/pubDate elements) — feedparser cannot parse it as an
      RSS/Atom feed, so `method: rss` yields 0 entries. Would need a dedicated sitemap collector
      (parse date/title from the URL slug, e.g. DD_MM_YYYY_Slug.html) - not currently implemented.
      (2) Homepage https://www.bundeskartellamt.de/ and the allowed listing page
      https://www.bundeskartellamt.de/DE/Infothek_Service/Aktuelles/aktuelles_node.html are both
      robots-allowed but their real press-release list is either link text too short ("Mehr erfahren",
      13 chars, below the generic HTML collector's 35-char title threshold) or loaded via a JS/AJAX
      search widget hosted under the disallowed /SiteGlobals/Forms/ path — so generic `method: html`
      returns only nav-menu links, not articles (silent 0-yield, would look "ok" while missing all news).
      Fix requires either a small collector change (sitemap-aware method, using
      https://www.bundeskartellamt.de/Sitemap_XML.xml with date parsed from the URL) or an accepted
      robots.txt exception — flagging for engineering / human review rather than forcing a broken
      html/rss mapping into the registry.
      2026-08-24 re-check (8th consecutive failing run): robots.txt unchanged (still disallows
      /DE/Service/, /EN/Service/, /SiteGlobals/ except a few asset sub-paths; only allowed Sitemap:
      https://www.bundeskartellamt.de/Sitemap_Index.xml). Additionally checked the homepage
      (https://www.bundeskartellamt.de/DE/Home/home_node.html, robots-allowed) directly: it does link
      real /SharedDocs/Meldung/DE/Pressemitteilungen/... and .../AktuelleMeldungen/... article URLs
      (SharedDocs is not disallowed), but every one of those anchors uses generic link text "Mehr
      erfahren" — same short/uninformative-title problem as the Aktuelles listing page, so the generic
      html collector still cannot extract usable titles without a bespoke per-source extractor (e.g.
      parsing the adjacent heading, or the DD_MM_YYYY_Slug in the URL). Also checked
      https://www.govdata.de (German open-data portal) for a Bundeskartellamt press-release dataset/API
      — none exists (0 results for "bundeskartellamt pressemitteilungen"). No new robots-allowed,
      generically-parseable route found. Conclusion unchanged: needs a small dedicated collector
      (sitemap- or SharedDocs-link-aware, deriving date from the URL slug) — out of scope for a
      registry-only specialist pass. Verdict: needs manual/engineering review, not a dead source.
      2026-08-30 re-check (3rd specialist pass): robots.txt byte-for-byte unchanged (still Disallow
      /SiteGlobals/, /DE/Service/, /EN/Service/; Allow only
      /SiteGlobals/Modules|StyleBundles|Frontend/; Sitemap:
      https://www.bundeskartellamt.de/Sitemap_Index.xml). Re-confirmed the RSS <link rel=alternate>
      on the homepage still resolves to
      https://www.bundeskartellamt.de/DE/Service/RSS/_documents/rssnewsfeed.xml (disallowed path).
      Re-fetched https://www.bundeskartellamt.de/Sitemap_XML.xml (200, ~438KB): still a plain
      sitemap with <lastmod> only (no titles), and lastmod values are stale/batch-updated (e.g. a
      2015 article shows lastmod 2024-01-31), so even a bespoke sitemap collector could not derive
      real publication dates from it — confirms the sitemap route is a dead end, not just
      infeasible with current tooling. Re-fetched homepage
      https://www.bundeskartellamt.de/DE/Home/home_node.html (200, robots-allowed): confirmed all
      linked /SharedDocs/Meldung/DE/(Pressemitteilungen|AktuelleMeldungen)/... article URLs (allowed
      path, not under /DE/Service/) still use identical anchor text "Mehr erfahren" (13 chars)
      site-wide, below the generic HTML collector's 35-char threshold in
      src/collectors/html_page.py (extract_links), so they are filtered out before any per-article
      title fetch is attempted. Checked for a replacement/mirror carrying the same content: no
      RSS/API alternative found (govdata.de has no Bundeskartellamt feed; no EU-level source
      republishes German national merger-clearance/investigation press releases at comparable
      granularity — EU Commission and ECN outputs cover EU-level or cross-border cases only, not a
      substitute for national enforcement coverage). No qualifying replacement proposed. Verdict
      unchanged: unresolved, needs a collector code change (SharedDocs-link + per-article
      <h1>/<title> extraction, bypassing the short-anchor-text filter for this allowed path), not a
      registry-only fix.
      2026-09-05 re-check (4th specialist pass): robots.txt re-fetched, byte-for-byte unchanged
      (Disallow /SiteGlobals/, /DE/Service/, /EN/Service/; Allow only
      /SiteGlobals/Modules|StyleBundles|Frontend/; Sitemap: https://www.bundeskartellamt.de/Sitemap_Index.xml).
      Searched for a syndication route outside bundeskartellamt.de: checked whether Bundesnetzagentur
      (sister federal authority) republishes Bundeskartellamt press releases with its own feed —
      https://www.bundesnetzagentur.de/SharedDocs/ExterneLinks/Presse/BKart-PM.html returns 200 but is
      only a static redirect/link stub to bundeskartellamt.de content, not an independent republished
      feed with its own dates, so not usable. Searched for a presseportal.de or similar press-wire
      syndication of Bundeskartellamt releases — none exists; Bundeskartellamt only distributes via its
      own RSS (disallowed path) and an opt-in email Presseverteiler (not a public feed). Re-confirmed
      /SharedDocs/Meldung/DE/Pressemitteilungen/ has no directory listing (redirects to homepage) and
      the homepage/Aktuelles listing still expose only "Mehr erfahren" anchor text. No new
      robots-allowed, feed-parseable route found; no viable replacement source found. Verdict
      unchanged: unresolved, needs the collector code change described above (out of scope for a
      registry-only specialist pass).
