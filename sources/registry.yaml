      ("PIM-JDE-Monitor/1.0 ...") on every path, including /robots.txt itself
      -- a site-wide WAF/anti-bot rule blocking non-browser UAs, not a
      robots.txt policy disallow (robots.txt is retrievable and permissive
      when fetched with a browser UA). Same 403 reproduces on the sibling
      domain wwf.panda.org (shared WWF web infra), ruling that out as an
      alternative. No RSS/Atom feed exists (/feed, /rss, /rss.xml all 404).
      /sitemap.xml is reachable but lists only the homepage (no article/news
      URLs), so it cannot substitute for a content feed. No public JSON API
      endpoint found. archive.org has only a stale single snapshot
      (2026-02-04, homepage only) via the wayback availability API -- too
      infrequent/shallow to serve as a recurring weekly feed. Per hard
      rules, did not attempt to bypass the block with a spoofed browser
      User-Agent (that would be circumventing an anti-bot measure).
      Re-verified 2026-09-05: identical site-wide HTTP 403 on /, /robots.txt,
      /sitemap.xml, /feed, /rss, /en/newsroom, /en/news with our identifying
      User-Agent; confirmed with a browser User-Agent (diagnostic only, not
      used for collection) that the block is UA-based, not IP-based, and that
      /sitemap.xml still lists only the homepage. wwf.panda.org still 403s
      too. No DNS record for media.wwf.eu or newsroom.wwf.eu. No change in
      status; deforestation/supply-chain advocacy signal remains covered by
      clientearth, mighty-earth, fairtrade-international and
      rainforest-alliance already in this registry, so no replacement entry
      was added.
