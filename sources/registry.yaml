      User-Agent on EVERY endpoint tried, including robots.txt and sitemap.xml
      (not just the homepage/news pages) - so no crawl policy can even be read.
      Tried /news-and-events/news-alerts, /rss, /en/rss, /-/rss,
      /documents/rss, /reach-training-materials, /who-we-are, /-/press-release:
      all 403. A plain browser User-Agent (Chrome UA string) DOES pass the WAF,
      but swapping in a browser signature to get past bot detection is exactly
      the anti-bot bypass this monitor must not perform, so it was not used.
      No public RSS/API/sitemap reachable under the declared identity. EU-level
      REACH/CLP restriction outcomes that reach legal force are still captured
      via the eur-lex source (Official Journal L series). Revisit if ECHA
      relaxes the WAF for identified non-browser clients or publishes a public
      feed elsewhere.'
