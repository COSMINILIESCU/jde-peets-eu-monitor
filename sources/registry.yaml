- id: pl-legislation
  name: Poland - ISAP
  url: https://isap.sejm.gov.pl/
  type: official_register
  country: PL
  language: &id031
  - pl
  access:
    method: auto
    rss: ''
    notes: >
      2026-08-17 specialist review: isap.sejm.gov.pl/robots.txt disallows all crawlers except
      Googlebot/Nekstbot (User-agent: * / Disallow: /), which is why every fetch attempt is
      correctly blocked -- this is intentional site policy, not a transient error. The same
      blanket "Disallow: /" (with only Google/AdsBot-Google exceptions) applies to the mirror
      dziennikustaw.gov.pl, so neither host has any legally accessible path (no feed/sitemap
      is exempted). No RSS/Atom feed exists on either host.
      Found a working, robots-compliant alternative: the official Sejm ELI API at
      https://api.sejm.gov.pl/eli/acts/DU/{year} (e.g. https://api.sejm.gov.pl/eli/acts/DU/2026)
      -- a different host with NO robots.txt (404, i.e. no crawl restriction declared) that
      returns the full current-year Dziennik Ustaw index as JSON (title, ELI id, announcementDate,
      promulgation date, status, type) and is clearly built for public/programmatic consumption.
      Confirmed reachable and returning live 2026 data during this review.
      BLOCKED ON CODE: this repo's collector only implements method in {rss, html, pdf}
      (src/collectors/collect.py, src/collectors/html_page.py) -- there is no JSON/API collector,
      and any access.rss value forces RSS/XML parsing regardless of access.method, so the JSON
      endpoint cannot be wired through the registry alone. Needs a small collector addition
      (a `method: api` branch that GETs the URL and parses the `items` JSON array) before this
      source can resume. Recommended target once implemented:
      access.method: api, access.rss: https://api.sejm.gov.pl/eli/acts/DU/2026 (roll the year,
      or use the API's date-range/search params if available).
  monitoring_focus: New laws, consolidations, EU transposition acts and national measures in the official legislation
    database.
  categories: *id006
  trust_tier: official
  status: unresolved
  exclusion_reason: >
    isap.sejm.gov.pl and its mirror dziennikustaw.gov.pl both disallow all crawlers via
    robots.txt (Disallow: / for User-agent: *, with narrow Googlebot-only exceptions) and
    neither publishes a feed/sitemap that is exempted. A working replacement was found
    (official JSON API at api.sejm.gov.pl/eli/acts, no robots.txt restriction) but the
    collector pipeline has no JSON/API method (only rss/html/pdf) -- see access.notes.
    Requires a collector code change, out of scope for a registry-only fix.
  origin: pdf_inventar
