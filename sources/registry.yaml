  status: unresolved
  exclusion_reason: >
    2026-09-05 specialist re-check confirms prior finding below still holds: HTTP 403 on
    homepage, article pages, /feed, /rss and /wp-json/* under our declared collector
    User-Agent (config/settings.yaml) -- only the Yoast sitemap XML paths
    (/sitemap_index.xml, /post-sitemap*.xml) return 200, but those give URLs/lastmod dates
    only, no title or body text, since every article page itself is still 403. A generic
    browser User-Agent does return 200 everywhere, but spoofing one is exactly the anti-bot
    bypass this project's hard rules forbid, so it was not adopted. Verdict unchanged:
    unresolved, no code-free fix exists.
    ---
    HTTP 403 on both the homepage and the WordPress feed (/feed/, /rss) when requested with our
    declared collector identity (config.user_agent, a descriptive non-browser UA) or with any
    generic non-browser-looking UA (plain "Mozilla/5.0", python-requests default, even
    Googlebot's UA string) - all return 403. robots.txt itself (https://www.gcrmag.com/robots.txt)
    allows all crawlers ("User-agent: * / Disallow:"), so this is a WAF/CDN-level bot
    fingerprint check, not a robots.txt block. The site only serves 200 when a full realistic
    desktop-Chrome UA string is sent, which would mean disguising the collector as a real
    browser to evade the site's anti-bot filtering - that is an anti-bot bypass and is
    disallowed by policy, so it is not implemented.
    2026-08-30 re-check (verifying a prior lead about the sitemap): unlike the homepage/feed/rss,
    https://www.gcrmag.com/sitemap.xml AND its current post-sitemap
    (https://www.gcrmag.com/post-sitemap7.xml, lastmod 2026-08-28) DO return HTTP 200 under our
    declared UA - confirmed by direct fetch, not blocked by the same WAF. The post-sitemap lists
    real, current article URLs with <lastmod> dates (e.g.
    /sca-announces-board-of-directors-candidates/ at 2026-08-28, several JDE-Peet's-relevant items
    such as /jde-peets-launches-nature-transition-plan-for-coffee-supply-chains/), so the lead is
    real. It does NOT however translate into usable access with this project's collector:
    (1) it is a plain Yoast SEO XML sitemap with no <title>/RSS-style fields - feedparser.parse()
    on it returns 0 entries, so setting access.method: rss to this URL would silently yield
    "ok, 0 found" every run forever, exactly the silent-failure trap this project's scraper
    lessons warn against, not a real fix. (2) the generic HTML collector cannot use it either - a
    sitemap has <loc> tags, not <a href> anchors with link text. (3) even extracting URLs from the
    sitemap by hand would not help - every individual article page (confirmed on
    /sca-announces-board-of-directors-candidates/) still returns HTTP 403 under our declared UA,
