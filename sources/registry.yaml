    notes: 'Specialist 2026-08-08: www.euipo.europa.eu blocks the monitor''s
      declared User-Agent with HTTP 403 on every path tried (homepage,
      robots.txt, sitemap.xml, /en/news, /en/news-and-events, press-releases
      page). The bare euipo.europa.eu host serves robots.txt (200, permissive,
      pointing to the www sitemap) but resets the TCP connection on actual
      content paths for the same User-Agent - a second layer of blocking, not
      a fluke. A plain browser (Chrome) User-Agent DOES pass on www., proving
      this is UA-signature bot detection rather than a network/geo block, but
      swapping to a browser signature to defeat that detection is the anti-bot
      bypass this monitor must not perform, so it was not used. Checked the
      accessible-with-browser-UA pages for an RSS/Atom link (news, news-and-events,
      press-releases): none found - EUIPO has no public feed. No compliant
      alternative access route found.'
  monitoring_focus: EU trademarks, designs, decisions and news.
  categories:
  - competitors_direct
  - tech_data_ai
  trust_tier: official
  status: unresolved
  exclusion_reason: 'UA-based anti-bot wall on both euipo.europa.eu and
    www.euipo.europa.eu blocks the monitor''s declared identity on all
    endpoints (incl. robots.txt on www; TCP resets on the bare domain); no
    public RSS/API found. Not bypassable without prohibited browser-UA
    impersonation. Revisit if EUIPO relaxes bot detection or exposes a public
    feed.'
